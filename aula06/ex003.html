<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro programa...</title>
    <style>
        body {
            background-color: rgb(190, 205, 255);
            margin: 20px; /*comentario em css*/
            color:white;
            font-size: normal 20pt Arial;
        }
        h1 {
            color:rgb(126, 26, 26);
        }
    </style>
</head>
<body>
    <h1>Meu Primeiro Documento HTML</h1> <!-- O título da página é exibido em um cabeçalho -->
    <p>Este é o meu primeiro programa. Estou aprendendo a criar páginas web!</p>
    <script>
        var n1 = Number(window.prompt('Digite um número')) // retorna number
        var n2 = Number(window.prompt('Digite outro número')) // retorna number
        var s = n1 + n2
        window.alert(`A soma entre ${n1} e ${n2} é igual a ${s}`)
    </script>

</body>
</html>
