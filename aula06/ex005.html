<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Execicios Curso</title>
    
    <style>
        body {
            background-color:rgb(255, 205, 97);
            font: normal 20pt Arial;
        }
        h1{
            color:black;
        }
        p2{
            color:rgb(75, 42, 165);
        }
        p3{
            color:rgb(255, 255, 255);
        }
        p4{
            color:rgb(33, 163, 0);
        }

    </style>


</head>
<body>
    <h1>
        Exercícios Curso
    </h1>
    
    <script>
        var nome = window.prompt('Qual é o seu nome?')
        document.write(`<p2>Seu nome tem ${nome.length} letras.</p2></br>`)
        document.write(`<p3>Seu nome em maiúsculas é ${nome.toUpperCase()}.</p3></br>`)
        document.write(`<p4>Seu nome em minúsculas é ${nome.toLowerCase()}.</p4>`)
        //toUpperCase() - converte o texto para maiúsculo
        //toLowerCase() - converte o texto para minúsculo
        //length - retorna a quantidade de caracteres do texto
    </script>

</body>
</html>
